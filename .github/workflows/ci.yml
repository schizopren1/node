name: Node.js CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the project
        uses: actions/checkout@v7

      - name: Install the software (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download dependencies
        run: npm install
